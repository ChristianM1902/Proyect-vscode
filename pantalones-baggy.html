<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pantalones baggy - Vibe Streetwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>

<header>
    <div class="container">
        <h1 class="site-title">pantalones baggy</h1>
        <nav>
            <a href="index.html" class="nav-link">Volver a la tienda</a>
            <a href="carrito.html" class="nav-link">Carrito (<span id="cart-count">0</span>)</a>        </nav>
    </div>
</header>

<div class="container">
    <section class="product-detail">
        <h2>Detalles del Producto</h2>
        <div class="product-main-image">
            <img src="https://via.placeholder.com/800x1000?text=pantalones+baggy+Detalle" alt="pantalones baggy Detalle">
        </div>
        <p class="product-description">Pantalones baggy de alta calidad, disponibles en varias tallas y colores. Ideal para ocasiones informales.</p>
        <p class="product-price"><strong>Precio:</strong> $29.99</p>

        <!-- Botón para añadir al carrito -->
        <button class="buy-button" onclick="addToCart('Pantalones Baggy', 29.99)">Añadir al carrito</button>

        <h3>Más Imágenes</h3>
        <div class="gallery">
            <img src="https://via.placeholder.com/800x1000?text=pantalones+baggy+1" alt="pantalones baggy 1">
            <img src="https://via.placeholder.com/800x1000?text=pantalones+baggy+2" alt="pantalones baggy 2">
            <img src="https://via.placeholder.com/800x1000?text=pantalones+baggy+3" alt="pantalones baggy 3">
        </div>
    </section>
</div>

<footer>
    <div class="container">
        <p>&copy; 2025 Tienda de Ropa | Todos los derechos reservados</p>
    </div>
</footer>

<!-- Modal Popup -->
<div id="popup" class="popup">
    <p id="popup-message"></p>
</div>

<script>
    // Carrito vacío por defecto
    let cart = [];

    // Función para añadir productos al carrito
    function addToCart(productName, productPrice) {
        // Crear un objeto de producto
        let product = {
            name: productName,
            price: productPrice,
            quantity: 1
        };

        // Verificar si el producto ya está en el carrito
        let existingProduct = cart.find(item => item.name === productName);
        if (existingProduct) {
            // Si ya está, incrementamos la cantidad
            existingProduct.quantity += 1;
        } else {
            // Si no está, lo agregamos al carrito
            cart.push(product);
        }

        // Actualizar el contador del carrito en la interfaz
        updateCartCount();

        // Mostrar el pop-up (modal)
        showPopup(productName);
    }

    // Función para actualizar el contador del carrito
    function updateCartCount() {
        let cartCount = cart.reduce((total, item) => total + item.quantity, 0);
        document.getElementById('cart-count').textContent = cartCount;
    }

    // Función para mostrar el pop-up (modal)
    function showPopup(productName) {
        const popup = document.getElementById('popup');
        const popupMessage = document.getElementById('popup-message');

        popupMessage.textContent = `¡${productName} ha sido añadido al carrito!`;
        popup.style.display = 'block';

        // Ocultar el modal después de 3 segundos
        setTimeout(function() {
            popup.style.display = 'none';
        }, 3000);
    }
</script>

</body>
</html>
